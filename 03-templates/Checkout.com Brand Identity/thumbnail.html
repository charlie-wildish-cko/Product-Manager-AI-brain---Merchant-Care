<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="./styles.css">
<style>
  html,body{margin:0}
  .tile{width:1280px;height:854px;display:flex;overflow:hidden}
  .main{flex:1;background:var(--blue);display:flex;align-items:center;justify-content:center}
  .main img{width:58%;height:auto}
  .strip{width:300px;display:flex;flex-direction:column}
  .strip div{flex:1}
</style>
</head>
<body>
  <div class="tile">
    <div class="main"><img src="./assets/logo-lift-white.svg" alt="LIFT"></div>
    <div class="strip">
      <div style="background:var(--warning)"></div>
      <div style="background:var(--success)"></div>
      <div style="background:var(--insight)"></div>
    </div>
  </div>
</body>
</html>
