<!-- @dsCard group="Colors" viewport="700x180" name="Primary" subtitle="Checkout Blue, Midnight, White — the core brand triad" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--surface-page); padding: var(--space-6); }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-4); }
  .sw { border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--border-subtle); }
  .chip { height: 76px; }
  .meta { padding: var(--space-3); }
  .name { font-size: 14px; font-weight: 600; color: var(--text-strong); }
  .hex { font-family: var(--font-mono); font-size: 12px; color: var(--text-muted); margin-top: 2px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--blue)"></div><div class="meta"><div class="name">Checkout Blue</div><div class="hex">#006CFF</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--midnight)"></div><div class="meta"><div class="name">Midnight</div><div class="hex">#08111F</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--white)"></div><div class="meta"><div class="name">White</div><div class="hex">#FFFFFF</div></div></div>
  </div>
</body>
</html>
