<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--surface-page); color: var(--text-strong); padding: var(--space-8); }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: var(--space-4); text-align: center; }
  .n { font-size: 36px; line-height: 1; }
  .l { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); margin-top: var(--space-3); }
</style>
</head>
<body>
  <div class="row">
    <div><div class="n" style="font-weight:300">Aa</div><div class="l">Light · 300</div></div>
    <div><div class="n" style="font-weight:400">Aa</div><div class="l">Regular · 400</div></div>
    <div><div class="n" style="font-weight:500">Aa</div><div class="l">Medium · 500</div></div>
    <div><div class="n" style="font-weight:600">Aa</div><div class="l">Semibold · 600</div></div>
    <div><div class="n" style="font-weight:700">Aa</div><div class="l">Bold · 700</div></div>
  </div>
</body>
</html>
