<!-- @dsCard group="Spacing" viewport="700x200" name="Spacing scale" subtitle="4 · 8 · 12 · 16 · 24 · 32 · 48 · 64 · 96 · 128" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--surface-page); color: var(--text-strong); padding: var(--space-8); }
  .row { display: flex; align-items: flex-end; gap: var(--space-4); flex-wrap: wrap; }
  .item { text-align: center; }
  .bar { background: var(--blue); border-radius: 3px; width: 100%; }
  .v { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); margin-top: 6px; }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="bar" style="height:4px;width:4px"></div><div class="v">1·4</div></div>
    <div class="item"><div class="bar" style="height:8px;width:8px"></div><div class="v">2·8</div></div>
    <div class="item"><div class="bar" style="height:12px;width:12px"></div><div class="v">3·12</div></div>
    <div class="item"><div class="bar" style="height:16px;width:16px"></div><div class="v">4·16</div></div>
    <div class="item"><div class="bar" style="height:24px;width:24px"></div><div class="v">6·24</div></div>
    <div class="item"><div class="bar" style="height:32px;width:32px"></div><div class="v">8·32</div></div>
    <div class="item"><div class="bar" style="height:48px;width:48px"></div><div class="v">12·48</div></div>
    <div class="item"><div class="bar" style="height:64px;width:64px"></div><div class="v">16·64</div></div>
    <div class="item"><div class="bar" style="height:96px;width:96px"></div><div class="v">24·96</div></div>
  </div>
</body>
</html>
