<!-- @dsCard group="Colors" viewport="700x180" name="Performance accents" subtitle="Success, Warning, Error, Insight — status & signal" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--surface-page); padding: var(--space-6); }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-4); }
  .sw { border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--border-subtle); }
  .chip { height: 76px; }
  .meta { padding: var(--space-3); }
  .name { font-size: 14px; font-weight: 600; color: var(--text-strong); }
  .hex { font-family: var(--font-mono); font-size: 12px; color: var(--text-muted); margin-top: 2px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--success)"></div><div class="meta"><div class="name">Success</div><div class="hex">#00C875</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--warning)"></div><div class="meta"><div class="name">Warning</div><div class="hex">#FFB020</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--error)"></div><div class="meta"><div class="name">Error</div><div class="hex">#F04438</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--insight)"></div><div class="meta"><div class="name">Insight</div><div class="hex">#7B61FF</div></div></div>
  </div>
</body>
</html>
