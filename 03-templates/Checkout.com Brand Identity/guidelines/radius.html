<!-- @dsCard group="Spacing" viewport="700x180" name="Radius" subtitle="8 · 12 (default) · 16 (cards) · 24 · pill" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--surface-page); color: var(--text-strong); padding: var(--space-8); }
  .row { display: flex; gap: var(--space-6); align-items: center; }
  .item { text-align: center; }
  .box { width: 84px; height: 84px; background: var(--cloud); border: 1px solid var(--border-default); }
  .v { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); margin-top: var(--space-3); }
  .pill { width: 120px; border-radius: var(--radius-pill); }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="border-radius:var(--radius-sm)"></div><div class="v">sm · 8</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-md)"></div><div class="v">md · 12</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-lg)"></div><div class="v">lg · 16</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-xl)"></div><div class="v">xl · 24</div></div>
    <div class="item"><div class="box pill"></div><div class="v">pill · 999</div></div>
  </div>
</body>
</html>
