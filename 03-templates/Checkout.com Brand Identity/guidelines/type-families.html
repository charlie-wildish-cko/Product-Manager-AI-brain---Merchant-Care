<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--surface-page); color: var(--text-strong); padding: var(--space-8); }
  .block { padding: var(--space-4) 0; border-bottom: 1px solid var(--border-subtle); }
  .block:last-child { border-bottom: 0; }
  .tag { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); margin-bottom: 6px; }
  .big { font-size: 40px; letter-spacing: -.01em; }
</style>
</head>
<body>
  <div class="block">
    <div class="tag">Display — Archivo (Söhne substitute) · headlines, campaigns</div>
    <div class="big" style="font-family:var(--font-display);font-weight:700">Turn payments into performance</div>
  </div>
  <div class="block">
    <div class="tag">Primary — Inter · product, web, docs</div>
    <div class="big" style="font-weight:500">Scale without friction</div>
  </div>
  <div class="block">
    <div class="tag">Mono — JetBrains Mono · amounts, IDs, data</div>
    <div class="big" style="font-family:var(--font-mono);font-weight:500;font-variant-numeric:tabular-nums">$1,284,990.00</div>
  </div>
</body>
</html>
