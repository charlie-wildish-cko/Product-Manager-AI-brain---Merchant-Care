<!-- @dsCard group="Colors" viewport="700x180" name="Secondary" subtitle="Deep Navy, Steel, Cloud, Fog — supporting neutrals" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--surface-page); padding: var(--space-6); }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-4); }
  .sw { border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--border-subtle); }
  .chip { height: 76px; }
  .meta { padding: var(--space-3); }
  .name { font-size: 14px; font-weight: 600; color: var(--text-strong); }
  .hex { font-family: var(--font-mono); font-size: 12px; color: var(--text-muted); margin-top: 2px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--deep-navy)"></div><div class="meta"><div class="name">Deep Navy</div><div class="hex">#12233E</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--steel)"></div><div class="meta"><div class="name">Steel</div><div class="hex">#5E718D</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--cloud)"></div><div class="meta"><div class="name">Cloud</div><div class="hex">#EEF3FA</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--fog)"></div><div class="meta"><div class="name">Fog</div><div class="hex">#F7F9FC</div></div></div>
  </div>
</body>
</html>
