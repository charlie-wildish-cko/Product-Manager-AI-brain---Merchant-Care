<!-- @dsCard group="Spacing" viewport="700x200" name="Elevation" subtitle="Soft, sparing shadows — sm / md (default) / lg / brand" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--surface-subtle); color: var(--text-strong); padding: var(--space-12) var(--space-8); }
  .row { display: flex; gap: var(--space-8); align-items: center; }
  .item { text-align: center; }
  .box { width: 110px; height: 72px; background: var(--white); border-radius: var(--radius-lg); }
  .v { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); margin-top: var(--space-4); }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="box-shadow:var(--shadow-sm)"></div><div class="v">sm</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-md)"></div><div class="v">md · default</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-lg)"></div><div class="v">lg</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-brand)"></div><div class="v">brand</div></div>
  </div>
</body>
</html>
