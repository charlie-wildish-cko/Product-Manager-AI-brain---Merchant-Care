<!-- @dsCard group="Brand" viewport="700x260" name="Logo — lockup & icon" subtitle="Primary horizontal lockup, icon mark, and reversed variants" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--surface-page); color: var(--text-default); }
  .wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--border-subtle); }
  .cell { background: var(--surface-page); display: flex; align-items: center; justify-content: center; padding: var(--space-8); min-height: 96px; }
  .dark { background: var(--midnight); }
  .label { position: absolute; top: 0; left: 0; margin: var(--space-3); font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--text-muted); font-weight: 600; }
  .dark .label { color: var(--neutral-400); }
  .cell { position: relative; }
  img { display: block; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="cell"><span class="label">Horizontal lockup</span><img src="../assets/logo-lift-horizontal.svg" width="170" alt="LIFT"></div>
    <div class="cell dark"><span class="label">White / reversed</span><img src="../assets/logo-lift-white.svg" width="170" alt="LIFT white"></div>
    <div class="cell"><span class="label">Icon</span><img src="../assets/icon-lift.svg" width="56" alt="icon"></div>
    <div class="cell dark"><span class="label">Icon variants</span>
      <div style="display:flex; gap:var(--space-4); align-items:center;">
        <img src="../assets/icon-lift-white.svg" width="48" alt="icon white">
        <img src="../assets/icon-lift.svg" width="48" alt="icon gradient">
      </div>
    </div>
  </div>
</body>
</html>
