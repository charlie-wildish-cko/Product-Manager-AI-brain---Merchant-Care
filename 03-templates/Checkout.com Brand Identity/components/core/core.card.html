<body>

  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">

    const Plus = () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M12 5v14M5 12h14"/></svg>;

      return (

            <Button variant="danger">Refund</Button>

          <div className="row"><span className="lbl">Sizes & icon buttons</span>
            <Button size="sm">Small</Button>
            <Button size="lg">Large</Button>
            <IconButton label="Settings"><Gear/></IconButton>
            <IconButton label="Add" size="sm"><Plus/></IconButton>
          </div>
          <div className="row"><span className="lbl">Badges & tags</span>
