<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--surface-page); padding: var(--space-8); color: var(--text-default); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-6) var(--space-8); align-items: start; }
  .stack { display: flex; flex-direction: column; gap: var(--space-4); }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { Input, Switch, Checkbox } = window.LIFTDesignSystem_caf308;
    function Demo() {
      return (
        <div className="grid">
          <Input label="Email" type="email" placeholder="you@company.com" defaultValue="" />
          <Input label="Amount" hint="USD · settles in 2 days" defaultValue="240.00" />
          <Input label="API key" error="This key has expired" defaultValue="sk_live_4eC39…" />
          <Input label="Statement note" multiline rows={3} placeholder="Optional descriptor" />
          <div className="stack">
            <Switch label="Live mode" defaultChecked />
            <Switch label="Require 3DS" />
            <Switch label="Disabled" disabled />
          </div>
          <div className="stack">
            <Checkbox label="Save payment method" defaultChecked />
            <Checkbox label="Email receipt" />
            <Checkbox label="I agree to the terms" />
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
  </script>
</body>
</html>
