<!-- @dsCard group="Slides" viewport="1280x720" name="Title slide" subtitle="Keynote opener — Midnight, flow lines, display headline" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; }
  .slide { position: relative; width: 1280px; height: 720px; background: var(--midnight); color: #fff; overflow: hidden; font-family: var(--font-sans); }
  .flow { position: absolute; inset: 0; width: 100%; height: 100%; }
  .content { position: absolute; left: 96px; bottom: 96px; right: 96px; }
  .eyebrow { font-size: 14px; letter-spacing: .14em; text-transform: uppercase; color: var(--blue-300); font-weight: 600; margin-bottom: 28px; }
  h1 { font-family: var(--font-display); font-weight: 800; font-size: 84px; line-height: 0.98; letter-spacing: -0.03em; margin: 0; max-width: 920px; }
  .sub { font-size: 20px; color: var(--neutral-400); margin-top: 28px; max-width: 620px; }
  .logo { position: absolute; top: 64px; left: 96px; display: flex; align-items: center; gap: 14px; font-family: var(--font-display); font-weight: 800; font-size: 26px; letter-spacing: -0.5px; }
  .pg { position: absolute; top: 72px; right: 96px; font-family: var(--font-mono); font-size: 14px; color: var(--neutral-500); }
</style>
</head>
<body>
  <div class="slide">
    <svg class="flow" viewBox="0 0 1280 720" fill="none" preserveAspectRatio="xMidYMid slice">
      <defs><linearGradient id="g" x1="0" y1="720" x2="1280" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#006CFF"/><stop offset="1" stop-color="#7B61FF"/></linearGradient></defs>
      <path d="M-40 300 C 300 300, 460 90, 820 90 S 1180 20, 1340 0" stroke="url(#g)" stroke-width="2.5" opacity=".95"/>
      <path d="M-40 360 C 340 360, 520 150, 900 150 S 1220 90, 1340 70" stroke="#1E3354" stroke-width="1.5"/>
      <path d="M-40 240 C 260 240, 420 40, 760 40 S 1140 -30, 1340 -50" stroke="#1E3354" stroke-width="1.5"/>
      <circle cx="300" cy="300" r="5" fill="#006CFF"/>
      <circle cx="820" cy="90" r="6" fill="#7B61FF"/>
      <circle cx="900" cy="150" r="4" fill="#00C875"/>
    </svg>
    <div class="logo"><img src="../assets/icon-lift-white.svg" width="34" height="34" alt=""><span>LIFT</span></div>
    <div class="pg">Keynote · 2026</div>
    <div class="content">
      <div class="eyebrow">Intelligent payments infrastructure</div>
      <h1>Turn payments into performance.</h1>
      <p class="sub">Power the movement of money across the digital economy — built for scale, obsessed with performance.</p>
    </div>
  </div>
</body>
</html>
