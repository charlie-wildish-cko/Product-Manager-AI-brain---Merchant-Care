<!-- @dsCard group="Slides" viewport="1280x720" name="Statement slide" subtitle="Full-bleed brand gradient — single bold idea" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; }
  .slide { position: relative; width: 1280px; height: 720px; background: var(--gradient-primary); color: #fff; overflow: hidden; font-family: var(--font-sans); display: flex; align-items: center; }
  .inner { padding: 0 120px; }
  .mark { width: 56px; height: 4px; background: #fff; border-radius: 2px; margin-bottom: 40px; opacity: .9; }
  h1 { font-family: var(--font-display); font-weight: 700; font-size: 72px; line-height: 1.04; letter-spacing: -0.025em; margin: 0; max-width: 1000px; }
  .by { margin-top: 44px; font-size: 18px; color: rgba(255,255,255,.85); font-weight: 500; }
  .logo { position: absolute; bottom: 64px; left: 120px; display: flex; align-items: center; gap: 12px; font-family: var(--font-display); font-weight: 800; font-size: 22px; }
</style>
</head>
<body>
  <div class="slide">
    <div class="inner">
      <div class="mark"></div>
      <h1>Every payment should move business forward.</h1>
      <div class="by">The LIFT brand promise</div>
    </div>
    <div class="logo"><img src="../assets/icon-lift-white.svg" width="30" height="30" alt=""><span>LIFT</span></div>
  </div>
</body>
</html>
