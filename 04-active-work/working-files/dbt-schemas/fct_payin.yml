      - name: retrieval_outcome
        description: "At payment level: alphabetically-first retrieval outcome across the payment's dispute events (in practice typically a single value per payment). {{ doc('retrieval_outcome') }}"
        data_type: string
      - name: receive_predispute_outcome
        description: "At payment level: alphabetically-first predispute received outcome across the payment's dispute events (in practice typically a single value per payment). {{ doc('receive_predispute_outcome') }}"
        data_type: string
      - name: predispute_outcome
        description: "At payment level: outcome from the latest predispute outcome event across the payment's dispute events. {{ doc('predispute_outcome') }}"
