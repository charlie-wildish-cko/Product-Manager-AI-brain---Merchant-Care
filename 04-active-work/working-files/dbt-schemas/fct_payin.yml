        data_type: timestamp
      - name: api_version
        description: "{{ doc('api_version') }} Defaults to '1' for legacy ABC traffic. Sample values: '1' (legacy ABC /v2/charges endpoint), '2' / '2.0' (NAS /payments endpoint, dominant in current traffic)."
        data_type: string
      - name: api_version_name
        description: "The name of the CKO API version used. Sample values: ClassicAPI, UPAPI."
        data_type: string
      - name: payment_method_name
        description: "{{ doc('payment_method_name') }}"
        data_type: string
      - name: payment_method_group
        description: >
          Payment method grouping to display APM group when relevant. All card payments are grouped under 'Card',
