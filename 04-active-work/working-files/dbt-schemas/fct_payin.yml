        data_type: int64
      - name: dispute_updated_at
        description: "Timestamp when this payment was last updated at in the int_dispute_payin table."
        data_type: timestamp
      - name: is_fraud_reported
        description: "Flag indicating the payment has been reported as fraudulent by Visa, Mastercard, or Cartes Bancaires. true: a fraud report exists for this payment (including partial fraud where is_partial_fraud_reported = true); false/NULL: no fraud report. Sourced from int_reported_fraud_payin."
        data_type: boolean
      - name: fraud_outcome
        description: "{{ doc('fraud_outcome') }}"
        data_type: string
      - name: fraud_reported_payments
        description: "Count of payments that have been reported as fraudulent by Visa, Mastercard, or Cartes Bancaires (0 or 1 per payment). Always 1 when is_fraud_reported = true."
        data_type: int64
      - name: time_capture_outcome_to_fraud_issued_seconds
        description: "The number of seconds between the capture_outcome_at timestamp and the fraud_issued_at timestamp (when the fraudulent payment was spotted by the issuer). Measures how long after capture the issuer detected fraud."
        data_type: int64
      - name: time_capture_outcome_to_fraud_reported_seconds
        description: "The number of seconds between the capture_outcome_at timestamp and the fraud_reported_at timestamp (when the fraud record was created in the scheme source). Measures how long after capture the fraud was formally reported."
        data_type: int64
      - name: fraud_first_updated_at
        description: "Timestamp (UTC) when the payment record was first updated with fraud data in fct_payin, based on the dbt run start time. Used to track when fraud information first landed on the payment."
        data_type: timestamp
      - name: fraud_updated_at
        description: "Timestamp (UTC) when the payment record was last updated with fraud data in fct_payin, based on the dbt run start time. May differ from fraud_first_updated_at when fraud data was re-processed."
        data_type: timestamp
      - name: reported_fraud_updated_at
        description: "Timestamp when this payment was last updated at in the int_reported_fraud_payin table."
        data_type: timestamp
      - name: has_sca_retry
        description: "Boolean flag indicating if any attempt was an SCA (Strong Customer Authentication) retry for this payment. An SCA retry is triggered by an 'SCA required' decline (20154) on a previous authorisation attempt, prompting Routing to retry through authentication to satisfy the issuer's SCA requirement."
        data_type: boolean
      - name: has_processor_cascading
        description: "Boolean flag indicating if any attempt was a retry by cascading to a different processor for this payment. Processor cascading is internal cascading (re-routing across Checkout's own processor connections), not cascading to Checkout from an upstream PSP."
        data_type: boolean
      - name: has_dunning_retry
        description: "Boolean flag indicating if any attempt was a dunning retry for this payment. A dunning retry is one where Routing applied the 'schedule' modification to retry the payment at a later time on the same processing rails — typically under the Automatic Issuer/Acquirer Downtime default rule (MIT transactions declined with 20068, 20091, or 20096 are retried up to four times over a one-hour window)."
        data_type: boolean
      - name: has_aft_retry
        description: "Boolean flag indicating if any attempt was an AFT (Account Funding Transaction) retry for this payment. An AFT retry is one where Routing applied the 'modify_aft' modification — overriding the AFT flag to process the payment as AFT or as a purchase. Fires under the AFT Override and Processor Eligibility default rule when a merchant override is set or the chosen processor does not support AFTs."
        data_type: boolean
      - name: has_skip_authentication_retry
        description: "Boolean flag indicating if any attempt was a skip-authentication retry for this payment. A skip-authentication retry is one where Routing applied the 'skip_authentication' modification — passing a Direct-to-Authorisation (DTA) exemption (e.g. low_value, transaction_risk_assessment, trusted_listing, secure_corporate_payment, no_authentication) to bypass 3DS."
        data_type: boolean
      - name: has_new_authentication_retry
        description: "Boolean flag indicating if any attempt was a new-authentication retry for this payment. A new-authentication retry is one where Routing applied the 'new_authentication' modification — instructing authentication to use a specific challenge indicator, 3DS exemption, or preferred authentication experience (e.g. challenged 3DS, frictionless flow with a TRA / low-value exemption). Drives the SCA Soft Decline Retry (20154) flow among others."
        data_type: boolean
      - name: has_authentication_strategy_retry
        description: "Boolean flag indicating if any attempt was an authentication-strategy retry for this payment — i.e. a retry that amended the authentication strategy (either skip-authentication or new-authentication). true if has_skip_authentication_retry or has_new_authentication_retry is true for any attempt."
        data_type: boolean
      - name: has_avs_modification_retry
        description: "Boolean flag indicating if any attempt was an AVS-modification retry for this payment. An AVS-modification retry is one where Routing applied the 'modify_avs' modification — modifying the AVS (Address Verification System) data sent to the processor (drop first line, drop postcode, drop all) when the previous AVS check failed. Drives the AVS Technical Decline Retry default rule."
        data_type: boolean
      - name: has_cvv_modification_retry
        description: "Boolean flag indicating if any attempt was a CVV-modification retry for this payment. A CVV-modification retry is one where Routing applied the 'modify_cvv' modification — dropping the card CVV from the authorisation request — to retry a previously declined payment."
        data_type: boolean
      - name: has_expiry_modification_retry
        description: "Boolean flag indicating if any attempt was an expiry-modification retry for this payment. An expiry-modification retry is one where Routing applied the 'modify_expiry' modification — amending the card expiry date sent to the processor (drop, add 3 months, add 5 months) to retry a previously declined authorisation."
        data_type: boolean
      - name: has_iso_modification_retry
        description: "Boolean flag indicating if any attempt was an ISO-data modification retry for this payment — i.e. a retry that modified AVS, CVV, or expiry data on the authorisation message. true if any of has_avs_modification_retry, has_cvv_modification_retry, or has_expiry_modification_retry is true for any attempt."
        data_type: boolean
      - name: has_dpan_fpan_retry
        description: "Boolean flag indicating if any attempt was a DPAN/FPAN-switch retry for this payment. A DPAN/FPAN retry is one where Routing applied the 'use_instrument_type' modification — instructing Gateway to process the payment as either DPAN (network token) or FPAN (full PAN). Typical use case: first attempt declined on a network token, retry on FPAN."
        data_type: boolean
      - name: has_au_retry
        description: "Boolean flag indicating if any attempt was an Account Updater (AU) retry for this payment. An AU retry is one where Routing called Account Updater to refresh the card credentials (e.g. MasterCard's Real-Time Account Updater Pull API under the MasterCard RTAU Retries default rule for 20179/20192 + MAC01 declines) before retrying on the same processing rails."
        data_type: boolean
      - name: has_instrument_pan_retry
        description: "Boolean flag indicating if any attempt was an instrument-PAN retry for this payment — i.e. a retry that updated the PAN, either by switching between DPAN and FPAN or by calling Account Updater. true if has_dpan_fpan_retry or has_au_retry is true for any attempt."
        data_type: boolean
      - name: has_static_retry
        description: "Boolean flag indicating if any retry attempt for this payment went through a Static route. Static routes are per-merchant custom rules configured by the Merchant Configuration team at the processing-channel level."
        data_type: boolean
      - name: has_default_retry
        description: "Boolean flag indicating if any retry attempt for this payment went through a Default route. Default routes are globally-defined fallback rules opted in/out per merchant."
        data_type: boolean
      - name: has_intelligent_retry
        description: "Boolean flag indicating if any retry attempt for this payment went through an Intelligent route. Intelligent routes are Intelligent Acceptance / TENET rules selected by Routing's intelligent decisioning engine."
        data_type: boolean
      - name: routing_acceptance_attempts
        description: "Count of authorisation attempts associated with this payment as instructed by Routing — the maximum attempt_number across all routing events for the payment_id. May differ from the actual authorisation attempts seen in Gateway. An authorisation attempt can include an authentication within it. Currently only card payments undergo retries. Capped at 6 (1 first + 5 retries)."
        data_type: int64
      - name: latest_routing_ingestion_at
        description: "Timestamp of the most recent routing event ingestion for this payment — the ingestion timestamp (Flink pipeline landing time for live data; mapped from routing_ingestion_at for the Snowflake backfill) of the latest RouteResolved event Routing produced for this payment_id."
        data_type: timestamp
      - name: latest_retry_type_list
        description: "Comma-separated string listing the retry types applied on the latest routing attempt for this payment (the attempt with the highest attempt_number). Sample tokens: Processor Cascading, Dunning, AFT, DPAN-FPAN fallback, Skip authentication, New authentication, SCA, AVS modification, CVV modification, Expiry modification, Account Updater. Always blank for payments with only a First attempt."
        data_type: STRING
      - name: routing_latest_event_at
        description: "Source-system event time of the most recent routing event for this payment — the maximum event_timestamp across all RouteResolved events for this payment_id, i.e. the moment Routing returned its final decision to Gateway. Distinct from latest_routing_ingestion_at (platform ingestion time)."
        data_type: timestamp
      - name: routing_source_loaded_at
        description: "The latest loaded_at timestamp from the source staging table for this payment's routing events."
        data_type: timestamp
      - name: routing_updated_at
        description: "Timestamp when this payment was last updated at in the int_routing_payin table."
        data_type: timestamp
      - name: request_origin_updated_at
        description: "Timestamp when this payment was last updated at in the int_request_origin_payin table."
        data_type: timestamp
