        data_type: string
      - name: request_token_authentication_verification_value
        description: "Returns the Token Authentication Verification Value (TAVV) in the merchant request. 'Not applicable' for APM payments."
        data_type: string
      - name: token_authentication_verification_value
        description: Returns the Token Authentication Verification Value (TAVV) provided by CKO during authorisation. 'Not applicable' for APM payments.
