version: 2

models:
  - name: fct_payin
    description: |
       This model provides payment data for all payins. Each record is a separate payment.

       This is a view over `int_payin`, which is partitioned by `requested_at`. Please filter by `requested_at` to ensure your query is efficient.
    meta:
      tech_owner: Federico.Arduini@checkout.com
      tech_owner_team: Payment Analytics
      tech_owner_slack_channel: '#ask-analytics'
      security_classification: confidential
      refresh_frequency: bihourly
      severity: p1

    config:
      contract:
        enforced: true
    columns:
      - name: payment_id
        description: "{{ doc('payment_id') }}"
        data_type: string
      - name: client_id
        description: "{{ doc('client_id') }}"
        data_type: string
      - name: entity_id
        description: "{{ doc('entity_id') }}"
        data_type: string
      - name: processing_channel_id
        description: "{{ doc('processing_channel_id') }}"
        data_type: string
      - name: merchant_account_id
        description: "{{ doc('merchant_account_id') }}"
        data_type: string
      - name: business_id
        description: "{{ doc('business_id') }}"
        data_type: string
      - name: channel_id
        description: "{{ doc('channel_id') }}"
        data_type: string
      - name: request_sub_entities
        description: "{{ doc('request_sub_entities') }}"
        data_type: ARRAY<STRUCT<id STRING, name STRING, reference STRING, amount NUMERIC, commission_percentage FLOAT64, commission_amount NUMERIC>>
        meta:
          contains_pii: true
      - name: card_acceptor_id
        description: "{{ doc('card_acceptor_id') }}"
        data_type: string
      - name: scheme_merchant_id
        description: "{{ doc('scheme_merchant_id') }}"
        data_type: string
      - name: request_correlation_id
        description: "{{ doc('request_correlation_id') }}"
        data_type: string
      - name: charge_id
        description: "{{ doc('charge_id') }} Payment-level identifier shared with Disputes data for the same charge."
        data_type: string
      - name: decoded_action_id
        description: "{{ doc('decoded_action_id') }}"
        data_type: string
      - name: bc_charge_id
        description: "{{ doc('bc_charge_id') }}"
        data_type: string
      - name: payment_outcome
        description: "{{ doc('payment_outcome') }} Sample values: captured, soft_declined, authorised, voided, risk_declined, refunded."
        data_type: string
      - name: request_outcome
        description: "{{ doc('request_outcome') }} Always 'requested', as a row exists for every payment request. Sample values: requested."
        data_type: string
      - name: risk_decline_outcome
        description: "{{ doc('risk_decline_outcome') }} Sample values: risk_declined, not_risk_declined, not_available."
        data_type: string
      - name: authentication_outcome
        description: "{{ doc('authentication_outcome') }} Sample values: authenticated, failed, expired, rejected, non_authentication, not_applicable."
        data_type: string
      - name: authorisation_outcome
        description: "{{ doc('authorisation_outcome') }} Sample values: authorised, declined, non_authorisation."
        data_type: string
      - name: authorisation_increment_outcome
        description: "{{ doc('authorisation_increment_outcome') }} Sample values: incremented, declined, non_authorisation_increment, not_applicable."
        data_type: string
      - name: acceptance_outcome
        description: "{{ doc('acceptance_outcome') }} Sample values: accepted, hard_declined, soft_declined, risk_declined, expired, cancelled, void."
        data_type: string
      - name: void_outcome
        description: "{{ doc('void_outcome') }} Sample values: voided, partially_voided, non_void."
        data_type: string
      - name: capture_outcome
        description: "{{ doc('capture_outcome') }} Sample values: captured, partially_captured, non_capture."
        data_type: string
      - name: refund_outcome
        description: "{{ doc('refund_outcome') }} Sample values: refunded, partially_refunded, non_refund."
        data_type: string
      - name: gateway_chargeback_outcome
        description: "{{ doc('gateway_chargeback_outcome') }} Sample values: gateway_chargeback, non_gateway_chargeback."
        data_type: string
      - name: requested_at
        description: "{{ doc('requested_at') }} ISO8601 timestamp (UTC) of when the payment was requested by the merchant, taken from the ChargeRequested event."
        data_type: timestamp
      - name: risk_decline_outcome_at
        description: "{{ doc('risk_decline_outcome_at') }} Timestamp when the pre-authorisation risk decline outcome was determined."
        data_type: timestamp
      - name: pre_authentication_risk_assessment_outcome
        description: "{{ doc('pre_authentication_risk_assessment_outcome') }} Conceptually distinct from `risk_decline_outcome` (Gateway's actual ground truth) — this is RA's opinion, which can disagree with what Gateway actually did."
        data_type: string
      - name: pre_authentication_risk_assessment_outcome_source
        description: "{{ doc('pre_authentication_risk_assessment_outcome_source') }}"
        data_type: string
      - name: pre_authentication_risk_assessment_tenet_decline_not_used_payments
        description: "{{ doc('pre_authentication_risk_assessment_tenet_decline_not_used_payments') }}"
        data_type: int64
      - name: pre_authentication_risk_assessment_outcome_at
        description: "{{ doc('pre_authentication_risk_assessment_outcome_at') }}"
        data_type: timestamp
      - name: pre_authentication_risk_assessment_response_code
        description: "{{ doc('pre_authentication_risk_assessment_response_code') }}"
        data_type: string
      - name: pre_authentication_risk_assessment_response_summary
        description: "{{ doc('pre_authentication_risk_assessment_response_summary') }}"
        data_type: string
      - name: pre_authentication_risk_assessment_payments
        description: "{{ doc('pre_authentication_risk_assessment_payments') }}"
        data_type: int64
      - name: pre_authentication_risk_assessment_score
        description: "{{ doc('pre_authentication_risk_assessment_score') }} Distinct from `prism_score`, which is Fraud Detection's ML score alone (not combined with Tenet)."
        data_type: float64
      - name: pre_authentication_risk_assessment_resulting_assessment_level
        description: "{{ doc('pre_authentication_risk_assessment_resulting_assessment_level') }}"
        data_type: string
      - name: pre_authentication_risk_assessment_parent_merchant_outcome
        description: "{{ doc('pre_authentication_risk_assessment_parent_merchant_outcome') }}"
        data_type: string
      - name: pre_authentication_risk_assessment_sub_merchant_outcome
        description: "{{ doc('pre_authentication_risk_assessment_sub_merchant_outcome') }}"
        data_type: string
      - name: pre_authentication_risk_assessment_cko_outcome
        description: "{{ doc('pre_authentication_risk_assessment_cko_outcome') }}"
        data_type: string
      - name: pre_authentication_risk_assessment_route_details
        description: "{{ doc('pre_authentication_risk_assessment_route_details') }}"
        data_type: STRUCT<cko ARRAY<STRUCT<type STRING, name STRING, list_type STRING, score INT64, is_triggered BOOL, is_outcome_driver BOOL, sub_rules ARRAY<STRUCT<name STRING, score INT64, is_triggered BOOL, is_outcome_driver BOOL>>>>, parent_merchant ARRAY<STRUCT<type STRING, name STRING, list_type STRING, score INT64, is_triggered BOOL, is_outcome_driver BOOL, sub_rules ARRAY<STRUCT<name STRING, score INT64, is_triggered BOOL, is_outcome_driver BOOL>>>>, sub_merchant ARRAY<STRUCT<type STRING, name STRING, list_type STRING, score INT64, is_triggered BOOL, is_outcome_driver BOOL, sub_rules ARRAY<STRUCT<name STRING, score INT64, is_triggered BOOL, is_outcome_driver BOOL>>>>>
      - name: is_pre_authentication_risk_assessment_ml_control_group
        description: True when the payment was placed in the ML model's control group (no ML-driven action applied).
        data_type: boolean
      - name: pre_authentication_risk_assessment_ml_internal_score
        description: "{{ doc('pre_authentication_risk_assessment_ml_internal_score') }}"
        data_type: float64
      - name: pre_authentication_risk_assessment_ml_model_id
        description: "{{ doc('pre_authentication_risk_assessment_ml_model_id') }}"
        data_type: string
      - name: pre_authentication_risk_assessment_ml_model_version
        description: "{{ doc('pre_authentication_risk_assessment_ml_model_version') }}"
        data_type: string
      - name: pre_authentication_risk_assessment_ml_merchant_group
        description: "{{ doc('pre_authentication_risk_assessment_ml_merchant_group') }}"
        data_type: string
      - name: is_pre_authentication_tenet_risk_assessment_control_group
        description: "{{ doc('is_pre_authentication_tenet_risk_assessment_control_group') }}"
        data_type: boolean
      - name: post_authentication_risk_assessment_outcome
        description: "{{ doc('post_authentication_risk_assessment_outcome') }} `'not_available'` when there is no post-authentication record. Conceptually distinct from `void_outcome` (Gateway's independent ground truth) — this is RA's own opinion, which can disagree with what Gateway actually did."
        data_type: string
      - name: post_authentication_risk_assessment_outcome_at
        description: "{{ doc('post_authentication_risk_assessment_outcome_at') }}"
        data_type: timestamp
      - name: post_authentication_risk_assessment_response_code
        description: "{{ doc('post_authentication_risk_assessment_response_code') }}"
        data_type: string
      - name: post_authentication_risk_assessment_response_summary
        description: "{{ doc('post_authentication_risk_assessment_response_summary') }}"
        data_type: string
      - name: post_authentication_risk_assessment_resulting_assessment_level
        description: "{{ doc('post_authentication_risk_assessment_resulting_assessment_level') }}"
        data_type: string
      - name: post_authentication_risk_assessment_parent_merchant_outcome
        description: "{{ doc('post_authentication_risk_assessment_parent_merchant_outcome') }}"
        data_type: string
      - name: post_authentication_risk_assessment_sub_merchant_outcome
        description: "{{ doc('post_authentication_risk_assessment_sub_merchant_outcome') }}"
        data_type: string
      - name: post_authentication_risk_assessment_cko_outcome
        description: "{{ doc('post_authentication_risk_assessment_cko_outcome') }}"
        data_type: string
      - name: post_authentication_risk_assessment_route_details
        description: "{{ doc('post_authentication_risk_assessment_route_details') }}"
        data_type: STRUCT<cko ARRAY<STRUCT<type STRING, name STRING, list_type STRING, score INT64, is_triggered BOOL, is_outcome_driver BOOL, sub_rules ARRAY<STRUCT<name STRING, score INT64, is_triggered BOOL, is_outcome_driver BOOL>>>>, parent_merchant ARRAY<STRUCT<type STRING, name STRING, list_type STRING, score INT64, is_triggered BOOL, is_outcome_driver BOOL, sub_rules ARRAY<STRUCT<name STRING, score INT64, is_triggered BOOL, is_outcome_driver BOOL>>>>, sub_merchant ARRAY<STRUCT<type STRING, name STRING, list_type STRING, score INT64, is_triggered BOOL, is_outcome_driver BOOL, sub_rules ARRAY<STRUCT<name STRING, score INT64, is_triggered BOOL, is_outcome_driver BOOL>>>>>
      - name: post_authentication_risk_assessment_payments
        description: "{{ doc('post_authentication_risk_assessment_payments') }}"
        data_type: int64
      - name: fraud_detection_merchant_tier
        description: "{{ doc('fraud_detection_merchant_tier') }}"
        data_type: string
      - name: customer_ip_city
        description: "{{ doc('customer_ip_city') }}"
        data_type: string
      - name: customer_ip_timezone
        description: "{{ doc('customer_ip_timezone') }}"
        data_type: string
      - name: is_customer_ip_tor
        description: "{{ doc('is_customer_ip_tor') }}"
        data_type: boolean
      - name: is_customer_ip_vpn
        description: "{{ doc('is_customer_ip_vpn') }}"
        data_type: boolean
      - name: is_customer_ip_proxy
        description: "{{ doc('is_customer_ip_proxy') }}"
        data_type: boolean
      - name: is_customer_ip_bogon_ip
        description: "{{ doc('is_customer_ip_bogon_ip') }}"
        data_type: boolean
      - name: device_visitor_id
        description: "{{ doc('device_visitor_id') }}"
        data_type: string
        meta:
          contains_pii: true
      - name: device_ip
        description: "{{ doc('device_ip') }}"
        data_type: string
        meta:
          contains_pii: true
      - name: device_ip_country
        description: "{{ doc('device_ip_country') }}"
        data_type: string
      - name: device_source
        description: "{{ doc('device_source') }}"
        data_type: string
      - name: fingerprint_ip_timezone
        description: "{{ doc('fingerprint_ip_timezone') }}"
        data_type: string
      - name: is_fingerprint_ip_tor
        description: "{{ doc('is_fingerprint_ip_tor') }}"
        data_type: boolean
      - name: is_fingerprint_ip_vpn
        description: "{{ doc('is_fingerprint_ip_vpn') }}"
        data_type: boolean
      - name: is_fingerprint_ip_proxy
        description: "{{ doc('is_fingerprint_ip_proxy') }}"
        data_type: boolean
      - name: is_fingerprint_ip_bogon_ip
        description: "{{ doc('is_fingerprint_ip_bogon_ip') }}"
        data_type: boolean
      - name: risk_assessment_updated_at
        description: |
          `updated_at` from `int_risk_assessment` at merge time. Drives the RA merge operation's own
          incremental watermark — distinct from this model's own `updated_at`.
        data_type: timestamp
      - name: authorisation_outcome_at
        description: "{{ doc('authorisation_outcome_at') }} The processing time of the latest successful authorisation if one succeeded, otherwise of the latest authorisation attempt (declined or declined-pending-retry)."
        data_type: timestamp
      - name: acceptance_outcome_at
        description: "{{ doc('acceptance_outcome_at') }} Authorisation processing time for authorised/issuer-declined payments, authentication expiry/rejection/failure time for authentication-terminal payments, or the risk-decline time for risk-declined payments."
        data_type: timestamp
      - name: void_outcome_at
        description: "{{ doc('void_outcome_at') }}"
        data_type: timestamp
      - name: latest_voided_at
        description: "{{ doc('latest_voided_at') }}"
        data_type: timestamp
      - name: capture_outcome_at
        description: "{{ doc('capture_outcome_at') }}"
        data_type: timestamp
      - name: latest_captured_at
        description: "{{ doc('latest_captured_at') }}"
        data_type: timestamp
      - name: refund_outcome_at
        description: "{{ doc('refund_outcome_at') }}"
        data_type: timestamp
      - name: latest_refunded_at
