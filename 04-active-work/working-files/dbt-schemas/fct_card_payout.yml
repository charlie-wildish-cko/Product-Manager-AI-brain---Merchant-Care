version: 2

models:
  - name: fct_card_payout
    description: |
      Fact table for Pay To Card (PTC) payments / card payouts (PTC payment-level data unioned across Flink/NAS and legacy MBC sources). One row per PTC payment; filtered to `context_category` in ('payout', 'unknown') or NULL (legacy data), and excludes payments whose payout requests were rejected (`decline_reason = 'authorize'`).

      This is a view over `int_card_payout_v2`, which is partitioned by `requested_at`. Please filter by `requested_at` to ensure your query is efficient.
    meta:
      refresh_frequency: bihourly
      severity: p1
      tech_owner: Shreya.Alva@checkout.com
      tech_owner_slack_channel: '#ask-analytics'
      tech_owner_team: Payment Analytics
      security_classification: confidential
    config:
      contract:
        enforced: true
    columns:
      - name: payment_id
        description: "{{ doc('payment_id') }}"
        data_type: string
        data_tests:
          - not_null
          - unique
      - name: client_id
        description: "{{ doc('client_id') }}"
        data_type: string
      - name: entity_id
        description: "{{ doc('entity_id') }}"
        data_type: string
      - name: sub_entity_id
        description: "{{ doc('sub_entity_id') }}"
        data_type: string
      - name: processing_channel_id
        description: "{{ doc('processing_channel_id') }}"
        data_type: string
      - name: merchant_account_id
        description: "[LEGACY] {{ doc('merchant_account_id') }}"
        data_type: numeric
      - name: business_id
        description: "[LEGACY] {{ doc('business_id') }}"
        data_type: numeric
      - name: channel_id
        description: "[LEGACY] {{ doc('channel_id') }}"
        data_type: numeric
      - name: context_category
        description: "Business context for the payment, distinguishing standalone payouts from refunds. Sample values: payout, unknown. NULL for legacy data."
        data_type: string
      - name: requested_at
        description: "{{ doc('requested_at') }}"
        data_type: timestamp
      - name: processed_at
        description: "Timestamp at which the payout reached a terminal state — approved or declined (UTC). NULL while the payout is still in flight."
        data_type: timestamp
      - name: event_at
        description: "Timestamp of the latest event that modified this payment (UTC)."
        data_type: timestamp
      - name: declined_at
        description: "{{ doc('declined_at') }}"
        data_type: timestamp
      - name: approved_at
        description: "{{ doc('approved_at') }}"
        data_type: timestamp
      - name: is_gateway_services_only
        description: "[LEGACY] {{ doc('is_gateway_services_only') }}"
        data_type: boolean
      - name: is_gwc
        description: "{{ doc('is_gwc') }}"
        data_type: boolean
      - name: is_nas
        description: "{{ doc('is_nas') }}"
        data_type: boolean
      - name: is_mssql
        description: "[LEGACY] Indicates whether the payout originated from the legacy MSSQL source (true) or another source (false)."
        data_type: boolean
      - name: status
        description: "Payment status mapped to the analytics-team payin lexicon so PTC payouts align with `fct_payin` reporting. Sample values: Authorised (from approved), Declined, Requested (from pending). Values outside this set fall through unchanged."
        data_type: string
      - name: request_correlation_id
        description: "{{ doc('request_correlation_id') }}"
        data_type: string
      - name: payment_currency_iso3
        description: "{{ doc('payment_currency_iso3') }}"
        data_type: string
      - name: currency_name
        description: "{{ doc('currency_name') }}"
        data_type: string
      - name: retrieval_reference_number
        description: "{{ doc('retrieval_reference_number') }}"
        data_type: string
      - name: scheme_transaction_id
        description: "{{ doc('scheme_transaction_id') }}"
        data_type: string
      - name: reference
        description: "Free-text merchant-supplied reference for the payment, sent on the original payout request."
        data_type: string
      - name: instruction_source_amount
        description: "Source amount funded by the merchant (pre-FX) in major currency units (e.g. dollars, not cents)."
        data_type: numeric
      - name: instruction_source_currency
        description: "ISO-4217 alpha-3 currency code of the source amount funded by the merchant (pre-FX). Sample values: USD, GBP, EUR, RON, DKK."
        data_type: string
      - name: segment_dimension_hash
        description: "{{ doc('segment_dimension_hash') }}"
        data_type: string
      - name: authorisation_code
        description: "Authorisation code returned by the issuer for approved card payouts. Sample value: 006844."
        data_type: string
      - name: gateway_response_code
        description: "{{ doc('payment_gateway_response_code') }} {{ doc('payout_gateway_response_code_samples') }}"
        data_type: string
      - name: gateway_response_summary
        description: "{{ doc('gateway_response_summary') }}"
        data_type: string
      - name: card_type
        description: "{{ doc('card_type') }}"
        data_type: string
      - name: billing_descriptor_name
