        meta:
          contains_pii: true
      - name: card_holder_first_name
        description: "First name of the destination party when the recipient is an individual."
        data_type: string
        meta:
          contains_pii: true
      - name: card_holder_last_name
        description: "Last name of the destination party when the recipient is an individual."
        data_type: string
        meta:
