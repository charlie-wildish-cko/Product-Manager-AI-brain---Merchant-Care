name: repo-check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  repo-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check path references
        run: python3 scripts/repo_check.py
      - name: Run unit tests
        run: python3 -m unittest discover -s scripts
